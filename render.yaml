services:
  - type: web
    name: gloorbot-coordinator
    env: docker
    dockerfilePath: apps/coordinator/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: WORKER_DOWNLOAD_URL
        sync: false
      - key: DEAL_THRESHOLD
        value: "0.50"
      - key: CHEAPSKATER_INGEST_URL
        value: https://cheapskater.onrender.com/api/ingest/deals
      - key: CHEAPSKATER_INGEST_API_KEY
        value: JZhdARITo9ujVU2OcCaiqkx6ktB7SNh28ouQXz6U2f0=
    disk:
      name: gloorbot-data
      mountPath: /var/data
      sizeGB: 5


[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gloorbot-worker"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "playwright==1.49.1",
  "playwright-stealth==1.0.6",
  "psutil==6.1.0",
  "requests==2.32.5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

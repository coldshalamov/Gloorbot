name: Build Worker Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd apps/worker
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller==6.11.1

      - name: Install Playwright Chromium
        shell: pwsh
        run: |
          cd apps/worker
          $env:PLAYWRIGHT_BROWSERS_PATH = "$pwd\ms-playwright"
          python -m playwright install chromium

      - name: Build EXE with PyInstaller
        shell: pwsh
        run: |
          cd apps/worker
          $env:PLAYWRIGHT_BROWSERS_PATH = "$pwd\ms-playwright"
          pyinstaller --noconfirm --clean --name GloorbotWorker --noconsole `
            --add-data "..\..\PARALLEL;PARALLEL" `
            --add-data "ms-playwright;ms-playwright" `
            src\gloorbot_worker\__main__.py

      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" apps/worker/installer/worker.iss

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkerSetup
          path: apps/worker/dist-installer/WorkerSetup.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/worker/dist-installer/WorkerSetup.exe
          generate_release_notes: true
          draft: false
          prerelease: false

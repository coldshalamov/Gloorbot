name: Build Worker Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd apps/worker
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller==6.11.1 pillow pytest

      - name: Generate Icon for Worker
        shell: pwsh
        run: |
          python -c "from PIL import Image; img = Image.open('PARALLEL/gloorbot.png'); img.save('apps/worker/gloorbot.ico', format='ICO', sizes=[(256, 256), (128, 128), (64, 64), (48, 48), (32, 32), (16, 16)])"

      - name: Install Playwright Chromium
        shell: pwsh
        run: |
          # Set environment for bundled browsers (persist across steps)
          $pwBrowsers = "${env:GITHUB_WORKSPACE}/apps/worker/ms-playwright"
          "PLAYWRIGHT_BROWSERS_PATH=$pwBrowsers" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $env:PLAYWRIGHT_BROWSERS_PATH = $pwBrowsers
          python -m playwright install chromium

      - name: Run scraper regression suite
        shell: pwsh
        run: |
          cd $env:GITHUB_WORKSPACE
          python verification/run_suite.py

      - name: Build EXE with PyInstaller
        shell: pwsh
        run: |
          cd apps/worker
          pyinstaller --noconfirm --clean --name GloorbotWorker --noconsole `
            --paths "src" `
            --icon "gloorbot.ico" `
            --add-data "..\..\PARALLEL;PARALLEL" `
            --add-data "ms-playwright;ms-playwright" `
            --hidden-import "gloorbot_worker" `
            --hidden-import "gloorbot_worker.api" `
            --hidden-import "gloorbot_worker.gui" `
            --hidden-import "gloorbot_worker.paths" `
            --hidden-import "gloorbot_worker.slot_worker" `
            --hidden-import "gloorbot_worker.supervisor" `
            --collect-submodules "gloorbot_worker" `
            src\gloorbot_worker\__main__.py
          $expectedExe = "dist/GloorbotWorker/GloorbotWorker.exe"
          if (-not (Test-Path $expectedExe)) {
            $singleExe = "dist/GloorbotWorker.exe"
            if (Test-Path $singleExe) {
              New-Item -ItemType Directory -Force -Path "dist/GloorbotWorker" | Out-Null
              Move-Item -Force $singleExe $expectedExe
            } else {
              $found = Get-ChildItem -Path "dist" -Filter "GloorbotWorker.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($found) {
                New-Item -ItemType Directory -Force -Path "dist/GloorbotWorker" | Out-Null
                Copy-Item -Force $found.FullName $expectedExe
              }
            }
          }
          if (-not (Test-Path $expectedExe)) {
            throw "PyInstaller output missing: expected dist/GloorbotWorker/GloorbotWorker.exe"
          }

      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $isccCandidates = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
          }
          $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            throw "ISCC not found after install attempt. Checked: $($isccCandidates -join ', ')"
          }
          cd "$env:GITHUB_WORKSPACE/apps/worker"
          $version = "${{ github.ref_name }}" -replace '^v',''
          if ([string]::IsNullOrWhiteSpace($version)) { $version = "0.0.0" }
          if (-not (Test-Path "installer/worker.iss")) {
            throw "Missing installer/worker.iss"
          }
          if (-not (Test-Path "dist/GloorbotWorker/GloorbotWorker.exe")) {
            throw "Missing dist/GloorbotWorker/GloorbotWorker.exe"
          }
          & $iscc "/DMyAppVersion=$version" "installer/worker.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "ISCC failed with exit code $LASTEXITCODE"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkerSetup
          path: apps/worker/dist-installer/WorkerSetup.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/worker/dist-installer/WorkerSetup.exe
          generate_release_notes: true
          draft: false
          prerelease: false

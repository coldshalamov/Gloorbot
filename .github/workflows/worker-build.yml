name: Build Worker Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd apps/worker
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller==6.11.1 pillow pytest certifi

      - name: Generate Icon for Worker
        shell: pwsh
        run: |
          python -c "from PIL import Image; img = Image.open('PARALLEL/gloorbot.png'); img.save('apps/worker/gloorbot.ico', format='ICO', sizes=[(256, 256), (128, 128), (64, 64), (48, 48), (32, 32), (16, 16)])"

      - name: Install Playwright Chromium
        shell: pwsh
        run: |
          # Set environment for bundled browsers (persist across steps)
          $pwBrowsers = "${env:GITHUB_WORKSPACE}/apps/worker/ms-playwright"
          "PLAYWRIGHT_BROWSERS_PATH=$pwBrowsers" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $env:PLAYWRIGHT_BROWSERS_PATH = $pwBrowsers
          python -m playwright install chromium

      - name: Run scraper regression suite
        shell: pwsh
        run: |
          cd $env:GITHUB_WORKSPACE
          python verification/run_suite.py

      - name: Build EXE with PyInstaller
        shell: pwsh
        run: |
          cd apps/worker
          pyinstaller --noconfirm --clean --name GloorbotWorker --noconsole --onefile `
            --paths "src" `
            --icon "gloorbot.ico" `
            --add-data "..\..\PARALLEL;PARALLEL" `
            --add-data "ms-playwright;ms-playwright" `
            --collect-data "certifi" `
            --hidden-import "gloorbot_worker" `
            --hidden-import "gloorbot_worker.api" `
            --hidden-import "gloorbot_worker.gui" `
            --hidden-import "gloorbot_worker.paths" `
            --hidden-import "gloorbot_worker.slot_worker" `
            --hidden-import "gloorbot_worker.supervisor" `
            --hidden-import "certifi" `
            --collect-submodules "gloorbot_worker" `
            src\gloorbot_worker\__main__.py
          if (-not (Test-Path "dist/GloorbotWorker.exe")) {
            throw "PyInstaller output missing: expected dist/GloorbotWorker.exe"
          }

      - name: Prepare release artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cd "$env:GITHUB_WORKSPACE/apps/worker"
          if (-not (Test-Path "dist/GloorbotWorker.exe")) {
            throw "Missing dist/GloorbotWorker.exe"
          }
          New-Item -ItemType Directory -Force -Path "dist-installer" | Out-Null
          Copy-Item -Force "dist/GloorbotWorker.exe" "dist-installer/WorkerSetup.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkerSetup
          path: apps/worker/dist-installer/WorkerSetup.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/worker/dist-installer/WorkerSetup.exe
          generate_release_notes: true
          draft: false
          prerelease: false

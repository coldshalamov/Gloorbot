name: build-worker

on:
  workflow_dispatch:
  push:
    tags:
      - "worker-v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          cd apps/worker
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller==6.11.1

      - name: Install Playwright Chromium (bundled)
        shell: pwsh
        run: |
          cd apps/worker
          $env:PLAYWRIGHT_BROWSERS_PATH = "$pwd\\ms-playwright"
          python -m playwright install chromium

      - name: Build EXE (PyInstaller)
        shell: pwsh
        run: |
          cd apps/worker
          $env:PLAYWRIGHT_BROWSERS_PATH = "$pwd\\ms-playwright"
          pyinstaller --noconfirm --clean --name GloorbotWorker --noconsole --add-data "..\\..\\PARALLEL;PARALLEL" --add-data "ms-playwright;ms-playwright" src\\gloorbot_worker\\__main__.py

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y
          cd apps/worker
          & "C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe" installer\\worker.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: WorkerSetup
          path: apps/worker/dist-installer/WorkerSetup.exe

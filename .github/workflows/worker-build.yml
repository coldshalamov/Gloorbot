name: Build Worker Installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          cd apps/worker
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller==6.11.1 pillow

      - name: Generate Icon for Worker
        shell: pwsh
        run: |
          python -c "from PIL import Image; img = Image.open('PARALLEL/gloorbot.png'); img.save('apps/worker/gloorbot.ico', format='ICO', sizes=[(256, 256), (128, 128), (64, 64), (48, 48), (32, 32), (16, 16)])"

      # NOTE: We do NOT bundle Chromium anymore - Chrome is a hard requirement
      # This makes the installer much smaller (~50MB instead of ~200MB)

      - name: Build EXE with PyInstaller
        shell: pwsh
        run: |
          cd apps/worker
          pyinstaller --noconfirm --clean --name GloorbotWorker --noconsole `
            --paths "src" `
            --icon "gloorbot.ico" `
            --add-data "..\..\PARALLEL;PARALLEL" `
            --hidden-import "gloorbot_worker" `
            --hidden-import "gloorbot_worker.api" `
            --hidden-import "gloorbot_worker.gui" `
            --hidden-import "gloorbot_worker.paths" `
            --hidden-import "gloorbot_worker.slot_worker" `
            --hidden-import "gloorbot_worker.supervisor" `
            --collect-submodules "gloorbot_worker" `
            src\gloorbot_worker\__main__.py

      - name: Build installer with Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" apps/worker/installer/worker.iss

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkerSetup
          path: apps/worker/dist-installer/WorkerSetup.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/worker/dist-installer/WorkerSetup.exe
          generate_release_notes: true
          draft: false
          prerelease: false

<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Review Concat (Dot) Fixture</title>
  </head>
  <body>
    <!--
      Reproduces a common dirty-text failure mode:
      the was-price element's text includes the rating count immediately after the money
      string (e.g. "$1,149.00" + "3756" => "$1,149.003756").

      We should still extract the correct was-price and ignore the rating digits.
    -->
    <div class="tile_group">
      <div data-tile="1">
        <a href="/pd/Product-C/333">
          <span data-selector="splp-prd-ttl">Product C Range</span>
        </a>

        <div data-testid="current-price" aria-label="Actual Price $799.00">$799.00</div>

        <!-- No aria-label on purpose: force parsing from inner text -->
        <span data-testid="was-price"
          >$1,149.00<span class="rating-count">3756</span></span
        >
      </div>
    </div>
  </body>
</html>

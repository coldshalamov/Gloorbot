<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Financing Noise Fixture</title>
  </head>
  <body>
    <!--
      Fixture: financing/monthly-payment strings (e.g. "$125/mo") must not be treated as
      the product's real price. The real price is exposed via aria-label.
    -->
    <div class="tile_group">
      <div data-tile="1">
        <a href="/pd/Ashley-Heath-Products-2-500-Sq-Ft-Pedestal-Wood-Stove-2020-EPA-Certified/1003010946">
          <span data-selector="splp-prd-ttl">Ashley Hearth Products 2500-sq ft Wood Stove</span>
        </a>

        <!-- Real price: aria-label is the source of truth (visible split across nodes) -->
        <div aria-label="Actual Price $999.99">
          <span>$</span><span>999</span><span>.99</span>
        </div>

        <!-- Real was-price: aria-label only -->
        <div aria-label="Was Price $1,266.73">
          <span>$1,266.73</span>
        </div>

        <!-- Financing noise that must be rejected -->
        <div data-testid="current-price">$125/mo Suggested payments with 8 month special financing.</div>
      </div>
    </div>
  </body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Absurd Price Ceiling Test Fixture</title>
</head>
<body>
    <!-- Test fixture for absurd price ceiling violation -->
    <div class="tile_group">
        <div data-tile="1">
            <a href="/pd/product-12345">
                <h3>High-End Appliance</h3>
            </a>
            <div data-selector="splp-prd-act-$" aria-label="Actual Price $15,000">$15,000</div>
            <div data-selector="splp-prd-promo-was-$" aria-label="Was Price">$20,000</div>
            <span class="pickup-text">Pickup Today at Smokey Point</span>
        </div>
        <div data-tile="2">
            <a href="/pd/product-67890">
                <h3>Another Product</h3>
            </a>
            <div data-selector="splp-prd-act-$" aria-label="Actual Price $11,000">$11,000</div>
            <div data-selector="splp-prd-promo-was-$" aria-label="Was Price">$19,998</div>
            <span class="pickup-text">Pickup Today at Smokey Point</span>
        </div>
        <div data-tile="3">
            <a href="/pd/product-11111">
                <h3>Product Under $10k</h3>
            </a>
            <div data-selector="splp-prd-act-$" aria-label="Actual Price $9,999">$9,999</div>
            <div data-selector="splp-prd-promo-was-$" aria-label="Was Price">$19,998</div>
            <span class="pickup-text">Pickup Today at Smokey Point</span>
        </div>
    </div>
</body>
</html>
